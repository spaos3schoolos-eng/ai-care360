<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CARE 360 - สถิติ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#eef6ff;
}

header{

height:70px;
background:#1e88e5;
color:white;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 30px;

font-size:26px;
font-weight:bold;

}

.container{

display:flex;

}

.sidebar{

width:250px;
min-height:calc(100vh - 70px);

background:white;

box-shadow:3px 0 10px rgba(0,0,0,.1);

padding:20px;

}

.sidebar h3{

margin-bottom:20px;
color:#1e88e5;

}

.sidebar a{

display:block;

padding:12px;

margin-bottom:10px;

text-decoration:none;

color:#333;

border-radius:10px;

transition:.3s;

}

.sidebar a:hover{

background:#1e88e5;
color:white;

}

.main{

flex:1;

padding:30px;

}

h2{

color:#1e88e5;
margin-bottom:25px;

}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{

background:white;

padding:25px;

border-radius:20px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}

.card h1{

margin-top:10px;

font-size:42px;

}

.chart{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}

.row{

margin:20px 0;

}

.label{

display:flex;
justify-content:space-between;

margin-bottom:8px;

font-weight:bold;

}

.bar{

height:28px;

background:#dbeeff;

border-radius:30px;

overflow:hidden;

}

.fill{

height:100%;
width:0%;
transition:.6s;

}

.normal{

background:#4caf50;

}

.watch{

background:#ffc107;

}

.medium{

background:#fb8c00;

}

.high{

background:#e53935;

}
@media (max-width:768px){

    .cards{
        grid-template-columns:1fr;
    }

    .sidebar{
        width:180px;
    }

    .main{
        padding:15px;
    }

}
</style>

</head>

<body>

<header>

<div>🤖 AI CARE 360</div>

<div id="userRole"></div>

</header>

<div class="container">

<div class="sidebar">

<h3>เมนู</h3>

<a href="dashboard.html">🏠 หน้าหลัก</a>

<a href="student.html">👨‍🎓 ข้อมูลนักเรียน</a>

<a href="assessment.html">📝 แบบประเมิน</a>

<a href="statistics.html">📊 สถิติ</a>

<a href="risk.html">🚨 กลุ่มเสี่ยง</a>

<a href="report.html">📄 รายงาน</a>

<a href="setting.html" id="settingMenu">⚙️ ตั้งค่า</a>
<a href="#" onclick="logout()">🚪 ออกจากระบบ</a>

</div>

<div class="main">

<h2>สถิติการประเมิน SDQ</h2>

<div class="cards">

<div class="card">

นักเรียนทั้งหมด

<h1 id="total">0</h1>

</div>

<div class="card">

ปกติ

<h1 id="normal">0</h1>

</div>

<div class="card">

เฝ้าระวัง

<h1 id="watch">0</h1>

</div>

<div class="card">
กลุ่มเสี่ยง
<h1 id="medium">0</h1>
</div>

<div class="card">
วิกฤต
<h1 id="high">0</h1>
</div>

</div>

<div class="chart">

<h3>กราฟสรุปผลการประเมิน</h3>

<br>

<div class="row">

<div class="label">

<span>ปกติ</span>

<span id="normalPercent">0%</span>

</div>

<div class="bar">

<div class="fill normal" id="normalBar"></div>

</div>

</div>

<div class="row">

<div class="label">

<span>เฝ้าระวัง</span>

<span id="watchPercent">0%</span>

</div>

<div class="bar">

<div class="fill watch" id="watchBar"></div>

</div>

</div>
<div class="row">

<div class="label">

<span>กลุ่มเสี่ยง</span>

<span id="mediumPercent">0%</span>

</div>

<div class="bar">

<div class="fill medium" id="mediumBar"></div>

</div>

</div>

<div class="row">

<div class="label">

<span>วิกฤต</span>

<span id="highPercent">0%</span>

</div>

<div class="bar">

<div class="fill high" id="highBar"></div>

</div>

</div>

</div>

</div>

</div>

<script>

const user = JSON.parse(localStorage.getItem("loginUser"));

if(!user){
    alert("กรุณาเข้าสู่ระบบ");
    location.href="login.html";
}

const data = JSON.parse(localStorage.getItem("assessments")) || [];

const total = data.length;

let normal = 0;
let watch = 0;
let medium = 0;
let high = 0;

data.forEach(item=>{

    if(item.score>=61){

        normal++;

    }else if(item.score>=41){

        watch++;

    }else if(item.score>=21){

        medium++;

    }else{

        high++;

    }

});

const totalBox = document.getElementById("total");
const normalBox = document.getElementById("normal");
const watchBox = document.getElementById("watch");
const mediumBox = document.getElementById("medium");
const highBox = document.getElementById("high");

totalBox.textContent = total;
normalBox.textContent = normal;
watchBox.textContent = watch;
mediumBox.textContent = medium;
highBox.textContent = high;


function percent(value){
    return total === 0 ? 0 : (value / total) * 100;
}

const normalPercent = percent(normal);
const watchPercent = percent(watch);
const mediumPercent = percent(medium);
const highPercent = percent(high);

document.getElementById("normalBar").style.width = normalPercent + "%";
document.getElementById("watchBar").style.width = watchPercent + "%";
document.getElementById("mediumBar").style.width = mediumPercent + "%";
document.getElementById("highBar").style.width = highPercent + "%";

document.getElementById("normalPercent").textContent = normalPercent.toFixed(1) + "%";
document.getElementById("watchPercent").textContent = watchPercent.toFixed(1) + "%";
document.getElementById("mediumPercent").textContent = mediumPercent.toFixed(1) + "%";
document.getElementById("highPercent").textContent = highPercent.toFixed(1) + "%";
if(user.role==="admin"){
    document.getElementById("userRole").innerHTML="ผู้ดูแลระบบ";
}else{
    document.getElementById("userRole").innerHTML="ครู";
}

if(user.role!=="admin"){
    document.getElementById("settingMenu").style.display="none";
}

function logout(){
    localStorage.removeItem("loginUser");
    location.href="../index.html";
}
</script>

</body>
</html>
