<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CARE 360 - ตั้งค่าระบบ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#eef6ff;
}

header{
height:70px;
background:#1e88e5;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
font-size:26px;
font-weight:bold;
}

.container{
display:flex;
}

.sidebar{
width:250px;
min-height:calc(100vh - 70px);
background:white;
box-shadow:3px 0 10px rgba(0,0,0,.1);
padding:20px;
}

.sidebar h3{
margin-bottom:20px;
color:#1e88e5;
}

.sidebar a{
display:block;
padding:12px;
margin-bottom:10px;
text-decoration:none;
color:#333;
border-radius:10px;
transition:.3s;
}

.sidebar a:hover{
background:#1e88e5;
color:white;
}

.main{
flex:1;
padding:30px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
max-width:700px;
}

.card h2{
color:#1e88e5;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin-right:10px;
}

.saveBtn{
background:#1e88e5;
color:white;
}

.clearBtn{
background:#e53935;
color:white;
}

</style>

</head>

<body>

<header>

<div>🤖 AI CARE 360</div>

<div>ผู้บริหารโรงเรียน</div>

</header>

<div class="container">

<div class="sidebar">

<h3>เมนู</h3>

<a href="dashboard.html">🏠 หน้าหลัก</a>
<a href="student.html">👨‍🎓 ข้อมูลนักเรียน</a>
<a href="assessment.html">📝 แบบประเมิน</a>
<a href="statistics.html">📊 สถิติ</a>
<a href="risk.html">🚨 กลุ่มเสี่ยง</a>
<a href="report.html">📄 รายงาน</a>
<a href="setting.html">⚙️ ตั้งค่า</a>

</div>

<div class="main">

<div class="card">

<h2>ตั้งค่าระบบ</h2>

<label>ชื่อโรงเรียน</label>
<input id="schoolName" type="text">

<label>ชื่อผู้ดูแลระบบ</label>
<input id="adminName" type="text">

<label>ปีการศึกษา</label>
<input id="schoolYear" type="text">

<button class="saveBtn" onclick="saveSetting()">
💾 บันทึก
</button>

<button class="clearBtn" onclick="clearData()">
🗑️ ล้างข้อมูลการประเมินทั้งหมด
</button>

</div>

</div>

</div>
<script>

document.getElementById("schoolName").value =
localStorage.getItem("schoolName") || "";

document.getElementById("adminName").value =
localStorage.getItem("adminName") || "";

document.getElementById("schoolYear").value =
localStorage.getItem("schoolYear") || "";

function saveSetting(){

    localStorage.setItem(
        "schoolName",
        document.getElementById("schoolName").value
    );

    localStorage.setItem(
        "adminName",
        document.getElementById("adminName").value
    );

    localStorage.setItem(
        "schoolYear",
        document.getElementById("schoolYear").value
    );

    alert("บันทึกการตั้งค่าเรียบร้อย");

}

function clearData(){

    if(confirm("ต้องการล้างข้อมูลการประเมินทั้งหมดใช่หรือไม่?")){

        localStorage.removeItem("assessments");

        alert("ล้างข้อมูลเรียบร้อย");

        location.reload();

    }

}

</script>

</body>
</html>
