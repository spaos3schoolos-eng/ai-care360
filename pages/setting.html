<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CARE 360 - ตั้งค่าระบบ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

html,body{
    width:100%;
}

body{
    background:#eef6ff;
}

header{
    height:70px;
    background:#1e88e5;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    font-size:26px;
    font-weight:bold;
}

.container{
    display:flex;
}

.sidebar{
    width:250px;
    min-height:calc(100vh - 70px);
    background:white;
    box-shadow:3px 0 10px rgba(0,0,0,.1);
    padding:20px;
}

.sidebar h3{
    margin-bottom:20px;
    color:#1e88e5;
}

.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:10px;
    text-decoration:none;
    color:#333;
    border-radius:10px;
    transition:.3s;
}

.sidebar a:hover{
    background:#1e88e5;
    color:white;
}

.main{
    flex:1;
    min-width:0;
    padding:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    max-width:700px;
}

.card h2{
    color:#1e88e5;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    min-width:0;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.saveBtn{
    background:#1e88e5;
    color:white;
}

.clearBtn{
    background:#e53935;
    color:white;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* =========================================
   MOBILE / TABLET
   ========================================= */
@media(max-width:768px){

    html,body{
        max-width:100%;
        overflow-x:hidden;
    }

    header{
        height:auto;
        min-height:60px;
        padding:12px 14px;
        font-size:18px;
        gap:10px;
    }

    header > div:first-child{
        white-space:nowrap;
    }

    #userRole{
        font-size:14px;
        text-align:right;
    }

    .container{
        display:block;
        width:100%;
    }

    .sidebar{
        width:100%;
        min-height:0;
        padding:10px;
        display:flex;
        align-items:center;
        gap:8px;
        overflow-x:auto;
        white-space:nowrap;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
        -webkit-overflow-scrolling:touch;
    }

    .sidebar h3{
        display:none;
    }

    .sidebar a{
        flex:0 0 auto;
        margin:0;
        padding:9px 12px;
        background:#f4f9ff;
        font-size:14px;
    }

    .main{
        width:100%;
        padding:15px 10px 25px;
    }

    .card{
        width:100%;
        max-width:100%;
        padding:18px 14px;
        border-radius:14px;
    }

    .card h2{
        font-size:21px;
        margin-bottom:16px;
    }

    input{
        font-size:16px;
    }

    .actions{
        flex-direction:column;
    }

    button{
        width:100%;
        min-height:46px;
        margin:0;
    }
}

@media(max-width:420px){
    header{
        font-size:16px;
    }

    #userRole{
        font-size:12px;
    }

    .sidebar a{
        padding:8px 10px;
        font-size:13px;
    }

    .main{
        padding:12px 8px 20px;
    }

    .card{
        padding:16px 10px;
    }

    .card h2{
        font-size:19px;
    }
}
</style>
</head>

<body>

<header>
    <div>🤖 AI CARE 360</div>
    <div id="userRole"></div>
</header>

<div class="container">

    <div class="sidebar">
        <h3>เมนู</h3>

        <a href="dashboard.html">🏠 หน้าหลัก</a>
        <a href="student.html">👨‍🎓 ข้อมูลนักเรียน</a>
        <a href="assessment.html">📝 แบบประเมิน</a>
        <a href="statistics.html">📊 สถิติ</a>
        <a href="risk.html">🚨 กลุ่มเสี่ยง</a>
        <a href="report.html">📄 รายงาน</a>
        <a href="setting.html">⚙️ ตั้งค่า</a>
        <a href="#" onclick="logout()">🚪 ออกจากระบบ</a>
    </div>

    <div class="main">

        <div class="card">

            <h2>ตั้งค่าระบบ</h2>

            <label for="schoolName">ชื่อโรงเรียน</label>
            <input id="schoolName" type="text">

            <label for="adminName">ชื่อผู้ดูแลระบบ</label>
            <input id="adminName" type="text">

            <label for="schoolYear">ปีการศึกษา</label>
            <input id="schoolYear" type="text">

            <div class="actions">
                <button class="saveBtn" onclick="saveSetting()">
                    💾 บันทึก
                </button>

                <button class="clearBtn" onclick="clearData()">
                    🗑️ ล้าง Cache ในเครื่องนี้
                </button>
            </div>

        </div>

    </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem("loginUser"));

if(!user){
    alert("กรุณาเข้าสู่ระบบ");
    location.href = "login.html";
}

// หน้า setting ให้เฉพาะ admin เข้าใช้งาน
if(user.role !== "admin"){
    alert("หน้านี้สำหรับผู้ดูแลระบบเท่านั้น");
    location.href = "dashboard.html";
}

document.getElementById("userRole").textContent = "ผู้ดูแลระบบ";

document.getElementById("schoolName").value =
    localStorage.getItem("schoolName") || "";

document.getElementById("adminName").value =
    localStorage.getItem("adminName") || "";

document.getElementById("schoolYear").value =
    localStorage.getItem("schoolYear") || "";

function saveSetting(){

    localStorage.setItem(
        "schoolName",
        document.getElementById("schoolName").value.trim()
    );

    localStorage.setItem(
        "adminName",
        document.getElementById("adminName").value.trim()
    );

    localStorage.setItem(
        "schoolYear",
        document.getElementById("schoolYear").value.trim()
    );

    alert("บันทึกการตั้งค่าเรียบร้อย");
}

function clearData(){

    const ok = confirm(
        "ต้องการล้าง Cache ข้อมูลการประเมินในเครื่องนี้ใช่หรือไม่?\n\n" +
        "ข้อมูลจริงใน Google Sheet จะไม่ถูกลบ"
    );

    if(!ok){
        return;
    }

    localStorage.removeItem("assessments");
    localStorage.removeItem("assessments_cache_time");

    alert(
        "ล้าง Cache ในเครื่องเรียบร้อย\n" +
        "เมื่อเปิดหน้าข้อมูล ระบบจะโหลดข้อมูลจาก Google Sheet ใหม่"
    );
}

function logout(){
    localStorage.removeItem("loginUser");
    location.href = "index.html";
}
</script>

</body>
</html>
