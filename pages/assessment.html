<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Tahoma',sans-serif;
}

body{
background:linear-gradient(135deg,#dbeafe,#eef7ff);
padding:40px;
}

.container{

border-radius:20px;

}

.header{

}

}

.content{

}

.section{

}

.section h2{

}

.question{

}

.question label{

}

.question select{

padding:12px;
border-radius:10px;

font-size:16px;
}

button{
margin-top:40px;
width:100%;
padding:18px;
font-size:22px;
border:none;
border-radius:40px;
background:#0d6efd;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{

}

#result{
margin-top:30px;
padding:25px;
display:none;
border-radius:15px;
font-size:22px;
text-align:center;
font-weight:bold;
}

.good{

}

.watch{

color:#856404;
}

.risk{
background:#ffe5b4;
color:#8a4b00;
}

.danger{
background:#f8d7da;
color:#721c24;
}

footer{
margin-top:30px;
text-align:center;
color:#666;
font-size:14px;
}

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwAeCxBYRIQheUJalCbRdklt7SH0gQmDmkkirMIVt3ylNoDwhkFnfZFxvdUbmk0TTOsjA/exec";

const ASSESSMENT_CACHE_KEY = "assessments";
const ASSESSMENT_CACHE_TIME_KEY = "assessments_cache_time";

let isSaving = false;

function getRisk(score){
    if(score >= 61){
        return {
            text:"🟢 สุขภาพจิตอยู่ในเกณฑ์ดี",
            riskLevel:"ปกติ",
            css:"good"
        };
    }else if(score >= 41){
        return {
            text:"🟡 สุขภาพจิตอยู่ในเกณฑ์เฝ้าระวัง",
            riskLevel:"เฝ้าระวัง",
            css:"watch"
        };
    }else if(score >= 21){
        return {
            text:"🟠 สุขภาพจิตอยู่ในกลุ่มเสี่ยง",
            riskLevel:"กลุ่มเสี่ยง",
            css:"risk"
        };
    }

    return {
        text:"🔴 สุขภาพจิตอยู่ในกลุ่มวิกฤต ควรได้รับการดูแล",
        riskLevel:"วิกฤต",
        css:"danger"
    };
}

function readAssessmentCache(){
    try{
        const list = JSON.parse(
            localStorage.getItem(ASSESSMENT_CACHE_KEY) || "[]"
        );
        return Array.isArray(list) ? list : [];
    }catch(error){
        return [];
    }
}

function saveAssessmentCache(list){
    localStorage.setItem(
        ASSESSMENT_CACHE_KEY,
        JSON.stringify(list)
    );

    localStorage.setItem(
        ASSESSMENT_CACHE_TIME_KEY,
        String(Date.now())
    );
}

async function postAssessment(payload){

    const controller = new AbortController();

    const timeout = setTimeout(function(){
        controller.abort();
    },4500);

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(payload),
            signal:controller.signal
        });

        if(!response.ok){
            throw new Error(
                "HTTP error: " + response.status
            );
        }

        const result = await response.json();

        if(result && result.success === false){
            throw new Error(
                result.message ||
                "บันทึกข้อมูลไม่สำเร็จ"
            );
        }

        return result;

    }finally{
        clearTimeout(timeout);
    }
}

async function calculateScore(){

    if(isSaving){
        return;
    }

    const fullname =
        document.getElementById("fullname").value.trim();

    const classroom =
        document.getElementById("classroom").value.trim();

    const number =
        document.getElementById("number").value.trim();

    if(
        fullname === "" ||
        classroom === "" ||
        number === ""
    ){
        alert("กรุณากรอกข้อมูลนักเรียนให้ครบ");
        return;
    }

    const selects =
        document.querySelectorAll(".score");

    for(const item of selects){
        if(item.value === ""){
            alert("กรุณาเลือกคำตอบให้ครบทุกข้อ");
            return;
        }
    }

    let score = 0;

    // index 2,7,18 = ข้อ 3,8,19
    const negativeQuestions = [2,7,18];
    const answers = [];

    selects.forEach(function(item,index){

        const rawValue = Number(item.value);
        let calculatedValue = rawValue;

        if(negativeQuestions.includes(index)){
            calculatedValue = 4 - rawValue;
        }

        score += calculatedValue;

        answers.push({
            question:index + 1,
            answer:rawValue,
            score:calculatedValue
        });
    });

    const risk = getRisk(score);
    const result = document.getElementById("result");

    result.style.display = "block";
    result.className = risk.css;
    result.innerHTML = `
        <h2>${risk.text}</h2>
        <br>
        คะแนนรวม : <b>${score}</b> คะแนน
        <br><br>
        <span style="font-size:16px;">
            ⏳ กำลังบันทึกข้อมูล...
        </span>
    `;

    const student = {
        date:new Date().toISOString(),
        studentId:number,
        name:fullname,
        className:classroom,
        room:"",
        score:score,
        riskLevel:risk.riskLevel,
        answers:answers
    };

    const button =
        document.querySelector(
            'button[onclick="calculateScore()"]'
        );

    const oldButtonText = button.innerHTML;

    isSaving = true;
    button.disabled = true;
    button.innerHTML = "⏳ กำลังบันทึก...";

    try{

        await postAssessment(student);

        const assessments = readAssessmentCache();
        assessments.push(student);
        saveAssessmentCache(assessments);

        result.innerHTML = `
            <h2>${risk.text}</h2>
            <br>
            คะแนนรวม : <b>${score}</b> คะแนน
            <br><br>
            <span style="font-size:16px;">
                ✅ บันทึกข้อมูลเรียบร้อยแล้ว
            </span>
        `;

        document.getElementById("fullname").value = "";
        document.getElementById("classroom").value = "";
        document.getElementById("number").value = "";

        selects.forEach(function(item){
            item.selectedIndex = 0;
        });

        setTimeout(function(){
            result.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });
        },100);

        alert("บันทึกผลการประเมินเรียบร้อยแล้ว");

    }catch(error){

        console.error(
            "บันทึก Google Sheet ไม่สำเร็จ:",
            error
        );

        result.innerHTML = `
            <h2>${risk.text}</h2>
            <br>
            คะแนนรวม : <b>${score}</b> คะแนน
            <br><br>
            <span style="
                font-size:16px;
                color:#b71c1c;
            ">
                ❌ ยังบันทึกลงฐานข้อมูลไม่สำเร็จ
                กรุณากดประเมินอีกครั้ง
            </span>
        `;

        alert(
            error.name === "AbortError"
            ? "ฐานข้อมูลตอบช้าเกิน 4.5 วินาที กรุณาลองอีกครั้ง"
            : "บันทึกข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง"
        );

    }finally{

        isSaving = false;
        button.disabled = false;
        button.innerHTML = oldButtonText;

    }
}
</script>
