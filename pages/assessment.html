<script>

function calculateScore(){

const selects = document.querySelectorAll(".score");

for(let item of selects){
    if(item.value===""){
        alert("กรุณาเลือกคำตอบให้ครบทุกข้อ");
        return;
    }
}

let score = 0;

const negativeQuestions = [2, 7, 18];

selects.forEach(function(item, index){

    let value = Number(item.value);

    if(negativeQuestions.includes(index)){
        value = 4 - value;
    }

    score += value;
});
let text="";
let css="";

if(score>=61){

text="🟢 สุขภาพจิตอยู่ในเกณฑ์ดี";

css="good";

}else if(score>=41){

text="🟡 สุขภาพจิตอยู่ในเกณฑ์เฝ้าระวัง";

css="watch";

}else if(score>=21){

text="🟠 สุขภาพจิตอยู่ในกลุ่มเสี่ยง";

css="risk";

}else{

text="🔴 สุขภาพจิตอยู่ในกลุ่มวิกฤต ควรได้รับการดูแล";

css="danger";

}
const result = document.getElementById("result");

result.style.display = "block";
result.className = css;

result.innerHTML = `
<h2>${text}</h2>
<br>
คะแนนรวม : <b>${score}</b> คะแนน
`;
const fullname = document.getElementById("fullname").value.trim();
const classroom = document.getElementById("classroom").value.trim();
const number = document.getElementById("number").value.trim();

if(fullname === "" || classroom === "" || number === ""){
    alert("กรุณากรอกข้อมูลนักเรียนให้ครบ");
    return;
}
const student = {
    name: fullname,
    class: classroom,
    number: number,
    score: score,
    level: text,
    date: new Date().toLocaleDateString("th-TH")
};

let assessments =
JSON.parse(localStorage.getItem("assessments")) || [];

// ตรวจสอบว่ากรอกชื่อหรือไม่
if(student.name.trim() === ""){
    alert("กรุณากรอกชื่อนักเรียน");
    return;
}

// ค้นหาว่ามีข้อมูลนักเรียนคนเดิมอยู่แล้วหรือไม่
const index = assessments.findIndex(item =>
    item.name === student.name &&
    item.class === student.class &&
    item.number === student.number
);

// ถ้ามีแล้วให้อัปเดตข้อมูล
if(index !== -1){
    assessments[index] = student;
}else{
    assessments.push(student);
}
// ===== ส่งข้อมูลไป Google Sheet =====
const API_URL = "https://script.google.com/macros/s/AKfycbwAeCxBYRIQheUJalCbRdklt7SH0gQmDmkkirMIVt3ylNoDwhkFnfZFxvdUbmk0TTOsjA/exec";

fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
        studentId: student.number,
        name: student.name,
        className: student.class,
        room: "",
        score: student.score,
        riskLevel: student.level,
        answers: {}
    })
})
.then(response => response.json())
.then(data => {
    console.log("บันทึก Google Sheet สำเร็จ", data);
})
.catch(error => {
    console.error("บันทึก Google Sheet ไม่สำเร็จ", error);
});

// บันทึกลง LocalStorage

localStorage.setItem(
    "assessments",
    JSON.stringify(assessments)
);
// รีเซ็ตผลลัพธ์
setTimeout(() => {
    result.scrollIntoView({
        behavior: "smooth"
    });
},100);

// รีเซ็ตฟอร์ม
// ล้างข้อมูลในฟอร์ม
document.getElementById("fullname").value = "";
document.getElementById("classroom").value = "";
document.getElementById("number").value = "";

document.querySelectorAll(".score").forEach(item=>{
    item.selectedIndex = 0;
});

alert("บันทึกผลการประเมินเรียบร้อยแล้ว");

}
</script>
