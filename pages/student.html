<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CARE 360 - ข้อมูลนักเรียน</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef6ff;
}

header{
    height:70px;
    background:#1e88e5;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    font-size:26px;
    font-weight:bold;
}

.container{
    display:flex;
}

.sidebar{
    width:250px;
    min-height:calc(100vh - 70px);
    background:white;
    box-shadow:3px 0 10px rgba(0,0,0,.1);
    padding:20px;
}

.sidebar h3{
    color:#1e88e5;
    margin-bottom:20px;
}

.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:10px;
    text-decoration:none;
    color:#333;
    border-radius:10px;
    transition:.3s;
}

.sidebar a:hover{
    background:#1e88e5;
    color:white;
}

.main{
    flex:1;
    padding:30px;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title h2{
    color:#1e88e5;
}

.search{
    width:300px;
    padding:10px 15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

th{
    background:#1e88e5;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f4f9ff;
}

.normal{
    color:#2e7d32;
    font-weight:bold;
}

.watch{
    color:#f9a825;
    font-weight:bold;
}

.medium{
    color:#ef6c00;
    font-weight:bold;
}

.high{
    color:#d32f2f;
    font-weight:bold;
}

button{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.deleteBtn{
    background:#e53935;
    color:white;
}

.editBtn{
    background:#43a047;
    color:white;
    margin-right:5px;
}
</style>

</head>

<body>

<header>
<div>🤖 AI CARE 360</div>
<div id="userRole"></div>
</header>

<div class="container">

<div class="sidebar">

<h3>เมนู</h3>

<a href="dashboard.html">🏠 หน้าหลัก</a>
<a href="student.html">👨‍🎓 ข้อมูลนักเรียน</a>
<a href="assessment.html">📝 แบบประเมิน</a>
<a href="statistics.html">📊 สถิติ</a>
<a href="risk.html">🚨 กลุ่มเสี่ยง</a>
<a href="report.html">📄 รายงาน</a>
<a href="setting.html" id="settingMenu">⚙️ ตั้งค่า</a>

<a href="#" onclick="logout()">🚪 ออกจากระบบ</a>

</div>

<div class="main">

<div class="title">

<h2>ข้อมูลนักเรียน</h2>

<input
type="text"
id="search"
class="search"
placeholder="ค้นหาชื่อนักเรียน..."
>

</div>

<table>

<thead>

<tr>

<th>ลำดับ</th>

<th>ชื่อนักเรียน</th>

<th>คะแนน</th>

<th>ระดับ</th>

<th>จัดการ</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

</div>
<script>
const user = JSON.parse(localStorage.getItem("loginUser"));

if (!user) {
    alert("กรุณาเข้าสู่ระบบ");
    location.href = "login.html";
}

// ==========================================
// Google Apps Script API
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbwAeCxBYRIQheUJalCbRdklt7SH0gQmDmkkirMIVt3ylNoDwhkFnfZFxvdUbmk0TTOsjA/exec";

let data = [];

const table = document.getElementById("studentTable");
const search = document.getElementById("search");


// ==========================================
// แปลงคะแนนเป็นระดับ
// ==========================================
function getLevel(score) {

    score = Number(score) || 0;

    if (score >= 61) {
        return {
            text: "ปกติ",
            className: "normal"
        };

    } else if (score >= 41) {
        return {
            text: "เฝ้าระวัง",
            className: "watch"
        };

    } else if (score >= 21) {
        return {
            text: "กลุ่มเสี่ยง",
            className: "medium"
        };

    } else {
        return {
            text: "วิกฤต",
            className: "high"
        };
    }
}


// ==========================================
// แสดงข้อความกำลังโหลด
// ==========================================
function showLoading() {

    table.innerHTML = `
        <tr>
            <td colspan="5" style="padding:40px; color:#1e88e5;">
                ⏳ กำลังโหลดข้อมูลนักเรียน...
            </td>
        </tr>
    `;
}


// ==========================================
// โหลดข้อมูลจาก Google Sheet
// ==========================================
async function loadStudents(retry = 0) {

    showLoading();

    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, 15000);

    try {

        const response = await fetch(API_URL, {
            cache: "no-store",
            signal: controller.signal
        });

        clearTimeout(timeout);

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        const result = await response.json();

        if (Array.isArray(result)) {
            data = result;

        } else if (Array.isArray(result.data)) {
            data = result.data;

        } else {
            throw new Error(
                result.message || "รูปแบบข้อมูลจาก API ไม่ถูกต้อง"
            );
        }

        console.log("ข้อมูลนักเรียน:", data);

        loadTable(data);

    } catch (error) {

        clearTimeout(timeout);

        console.error("โหลดข้อมูลนักเรียนไม่สำเร็จ:", error);

        // ลองใหม่อัตโนมัติสูงสุด 3 ครั้ง
        if (retry < 2) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" style="padding:40px; color:#f9a825;">
                        กำลังเชื่อมต่อใหม่...
                    </td>
                </tr>
            `;

            setTimeout(() => {
                loadStudents(retry + 1);
            }, 2000);

            return;
        }

        table.innerHTML = `
            <tr>
                <td colspan="5" style="padding:40px; color:#d32f2f;">
                    ❌ โหลดข้อมูลไม่สำเร็จ
                    <br><br>

                    <button onclick="loadStudents()"
                    style="
                        background:#1e88e5;
                        color:white;
                        padding:10px 20px;
                    ">
                        ลองใหม่
                    </button>
                </td>
            </tr>
        `;
    }
}


// ==========================================
// แสดงตาราง
// ==========================================
function loadTable(list) {

    table.innerHTML = "";

    if (list.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="5" style="padding:40px;">
                    ไม่พบข้อมูลนักเรียน
                </td>
            </tr>
        `;

        return;
    }

    list.forEach((item, index) => {

        const score = Number(item.score) || 0;

        const level = getLevel(score);

        const row = document.createElement("tr");

        const numberCell = document.createElement("td");
        numberCell.textContent = index + 1;

        const nameCell = document.createElement("td");
        nameCell.textContent = item.name || "-";

        const scoreCell = document.createElement("td");
        scoreCell.textContent = score;

        const levelCell = document.createElement("td");
        levelCell.textContent = level.text;
        levelCell.className = level.className;

        const actionCell = document.createElement("td");

        const button = document.createElement("button");
        button.textContent = "ดูข้อมูล";
        button.className = "editBtn";

        button.onclick = function() {
            viewStudent(item);
        };

        actionCell.appendChild(button);

        row.appendChild(numberCell);
        row.appendChild(nameCell);
        row.appendChild(scoreCell);
        row.appendChild(levelCell);
        row.appendChild(actionCell);

        table.appendChild(row);
    });
}


// ==========================================
// ค้นหานักเรียน
// ==========================================
search.addEventListener("input", () => {

    const keyword = search.value
        .trim()
        .toLowerCase();

    const result = data.filter(item => {

        const name = String(item.name || "")
            .toLowerCase();

        const studentId = String(item.studentId || "")
            .toLowerCase();

        const className = String(item.className || "")
            .toLowerCase();

        return (
            name.includes(keyword) ||
            studentId.includes(keyword) ||
            className.includes(keyword)
        );
    });

    loadTable(result);
});


// ==========================================
// ดูข้อมูลนักเรียน
// ==========================================
function viewStudent(item) {

    const level = getLevel(item.score);

    alert(
        "ชื่อนักเรียน: " + (item.name || "-") +
        "\nรหัสนักเรียน: " + (item.studentId || "-") +
        "\nชั้น: " + (item.className || "-") +
        "\nห้อง: " + (item.room || "-") +
        "\nคะแนน: " + (item.score || 0) +
        "\nระดับ: " + level.text
    );
}


// ==========================================
// สิทธิ์ผู้ใช้งาน
// ==========================================
if (user.role === "admin") {

    document.getElementById("userRole").innerHTML =
        "ผู้ดูแลระบบ";

} else {

    document.getElementById("userRole").innerHTML =
        "ครู";
}

if (user.role !== "admin") {

    document.getElementById("settingMenu").style.display =
        "none";
}


// ==========================================
// Logout
// ==========================================
function logout() {

    localStorage.removeItem("loginUser");

    location.href = "index.html";
}


// ==========================================
// เริ่มโหลดข้อมูล
// ==========================================
loadStudents();

</script>
</body>

</html>
