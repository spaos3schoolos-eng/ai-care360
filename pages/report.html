<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CARE 360 - รายงาน</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#eef6ff;
}

header{
height:70px;
background:#1e88e5;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
font-size:26px;
font-weight:bold;
}

.container{
display:flex;
}

.sidebar{
width:250px;
min-height:calc(100vh - 70px);
background:white;
box-shadow:3px 0 10px rgba(0,0,0,.1);
padding:20px;
}

.sidebar h3{
margin-bottom:20px;
color:#1e88e5;
}

.sidebar a{
display:block;
padding:12px;
margin-bottom:10px;
text-decoration:none;
color:#333;
border-radius:10px;
transition:.3s;
}

.sidebar a:hover{
background:#1e88e5;
color:white;
}

.main{
flex:1;
padding:30px;
}

h2{
color:#1e88e5;
margin-bottom:25px;
}

.report{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#1e88e5;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

.printBtn{
margin-top:25px;
padding:12px 25px;
background:#1e88e5;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

@media print{

.sidebar,
.printBtn,
header{

display:none;

}

.main{

padding:0;

}

body{

background:white;

}

}

</style>

</head>

<body>

<header>

<div>🤖 AI CARE 360</div>

<div>ผู้บริหารโรงเรียน</div>

</header>

<div class="container">

<div class="sidebar">

<h3>เมนู</h3>

<a href="dashboard.html">🏠 หน้าหลัก</a>
<a href="student.html">👨‍🎓 ข้อมูลนักเรียน</a>
<a href="assessment.html">📝 แบบประเมิน</a>
<a href="statistics.html">📊 สถิติ</a>
<a href="risk.html">🚨 กลุ่มเสี่ยง</a>
<a href="report.html">📄 รายงาน</a>
<a href="setting.html">⚙️ ตั้งค่า</a>

</div>

<div class="main">

<h2>รายงานผลการประเมิน</h2>

<div class="report">

<table>

<thead>

<tr>

<th>ลำดับ</th>
<th>ชื่อนักเรียน</th>
<th>คะแนน</th>
<th>ผลการประเมิน</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

<button
class="printBtn"
onclick="window.print()">

🖨️ พิมพ์รายงาน

</button>

</div>

</div>

</div>
<script>

let data = JSON.parse(localStorage.getItem("assessments")) || [];

const table = document.getElementById("reportTable");

function getLevel(score){

    if(score >= 61){

        return "ปกติ";

    }else if(score >= 41){

        return "เฝ้าระวัง";

    }else if(score >= 21){

        return "กลุ่มเสี่ยง";

    }else{

        return "วิกฤต";

    }

}

function loadReport(){

    table.innerHTML = "";

    if(data.length === 0){

        table.innerHTML = `

<tr>

<td colspan="4">

ยังไม่มีข้อมูลการประเมิน

</td>

</tr>

`;

        return;

    }

    data.forEach((item,index)=>{

        table.innerHTML += `

<tr>

<td>${index+1}</td>

<td>${item.name}</td>

<td>${item.score}</td>

<td>${getLevel(item.score)}</td>

</tr>

`;

    });

}

loadReport();

</script>

</body>
</html>
