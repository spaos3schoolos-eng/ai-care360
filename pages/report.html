<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CARE 360 - รายงาน</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}
body{ background:#eef6ff; }
header{
    height:70px;
    background:#1e88e5;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    font-size:26px;
    font-weight:bold;
}
.container{ display:flex; }
.sidebar{
    width:250px;
    min-height:calc(100vh - 70px);
    background:white;
    box-shadow:3px 0 10px rgba(0,0,0,.1);
    padding:20px;
}
.sidebar h3{ margin-bottom:20px; color:#1e88e5; }
.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:10px;
    text-decoration:none;
    color:#333;
    border-radius:10px;
    transition:.3s;
}
.sidebar a:hover{ background:#1e88e5; color:white; }
.main{ flex:1; padding:30px; }
h2{ color:#1e88e5; margin-bottom:25px; }

.report{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}
.reportHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:15px;
    flex-wrap:wrap;
}
.reportInfo{
    color:#666;
    font-size:14px;
}
.search{
    width:300px;
    max-width:100%;
    padding:10px 14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}
.tableWrap{
    overflow-x:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th{
    background:#1e88e5;
    color:white;
    padding:12px;
}
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}
tr:hover{ background:#f4f9ff; }

.normal{ color:#2e7d32; font-weight:bold; }
.watch{ color:#d69e00; font-weight:bold; }
.medium{ color:#ef6c00; font-weight:bold; }
.high{ color:#d32f2f; font-weight:bold; }

.actions{
    display:flex;
    gap:10px;
    margin-top:25px;
    flex-wrap:wrap;
}
.printBtn{
    padding:12px 25px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}
.printBtn:hover{ background:#1565c0; }

.loading{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:#1e88e5;
    font-weight:bold;
}
.spinner{
    width:20px;
    height:20px;
    border:3px solid #dbeeff;
    border-top-color:#1e88e5;
    border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin{
    to{ transform:rotate(360deg); }
}

@media(max-width:768px){
    header{ padding:0 15px; font-size:20px; }
    .sidebar{ width:180px; }
    .main{ padding:15px; }
    table{ min-width:700px; }
}

@media print{
    .sidebar,
    .printBtn,
    .search,
    header{
        display:none !important;
    }
    .main{ padding:0; }
    body{ background:white; }
    .report{
        box-shadow:none;
        padding:0;
    }
    .tableWrap{ overflow:visible; }
    table{ min-width:0; }
    h2{ color:#000; }
}
</style>
</head>

<body>

<header>
    <div>🤖 AI CARE 360</div>
    <div id="userRole"></div>
</header>

<div class="container">

<div class="sidebar">
    <h3>เมนู</h3>
    <a href="dashboard.html">🏠 หน้าหลัก</a>
    <a href="student.html">👨‍🎓 ข้อมูลนักเรียน</a>
    <a href="assessment.html">📝 แบบประเมิน</a>
    <a href="statistics.html">📊 สถิติ</a>
    <a href="risk.html">🚨 กลุ่มเสี่ยง</a>
    <a href="report.html">📄 รายงาน</a>
    <a href="setting.html" id="settingMenu">⚙️ ตั้งค่า</a>
    <a href="#" onclick="logout()">🚪 ออกจากระบบ</a>
</div>

<div class="main">

<h2>📄 รายงานผลการประเมิน</h2>

<div class="report">

    <div class="reportHeader">
        <div>
            <strong>AI CARE 360</strong>
            <div class="reportInfo" id="reportInfo">
                กำลังโหลดข้อมูล...
            </div>
        </div>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="ค้นหาชื่อ / รหัสนักเรียน..."
        >
    </div>

    <div class="tableWrap">
        <table>
            <thead>
                <tr>
                    <th>ลำดับ</th>
                    <th>รหัสนักเรียน</th>
                    <th>ชื่อนักเรียน</th>
                    <th>ชั้น/ห้อง</th>
                    <th>คะแนน</th>
                    <th>ผลการประเมิน</th>
                </tr>
            </thead>

            <tbody id="reportTable">
                <tr>
                    <td colspan="6" style="padding:40px;">
                        <span class="loading">
                            <span class="spinner"></span>
                            กำลังโหลดข้อมูลรายงาน...
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="actions">
        <button class="printBtn" onclick="window.print()">
            🖨️ พิมพ์รายงาน
        </button>
    </div>

</div>
</div>
</div>

<script>
const user = JSON.parse(localStorage.getItem("loginUser"));

if (!user) {
    alert("กรุณาเข้าสู่ระบบ");
    location.href = "login.html";
}

const API_URL =
"https://script.google.com/macros/s/AKfycbwAeCxBYRIQheUJalCbRdklt7SH0gQmDmkkirMIVt3ylNoDwhkFnfZFxvdUbmk0TTOsjA/exec";

let data = [];

const table = document.getElementById("reportTable");
const search = document.getElementById("search");
const reportInfo = document.getElementById("reportInfo");

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function getLevel(score){
    score = Number(score) || 0;

    if (score >= 61) {
        return { text:"ปกติ", className:"normal" };
    } else if (score >= 41) {
        return { text:"เฝ้าระวัง", className:"watch" };
    } else if (score >= 21) {
        return { text:"กลุ่มเสี่ยง", className:"medium" };
    } else {
        return { text:"วิกฤต", className:"high" };
    }
}

function showLoading(){
    reportInfo.textContent = "กำลังโหลดข้อมูล...";

    table.innerHTML = `
        <tr>
            <td colspan="6" style="padding:40px;">
                <span class="loading">
                    <span class="spinner"></span>
                    กำลังโหลดข้อมูลรายงาน...
                </span>
            </td>
        </tr>
    `;
}

function renderReport(list){
    if (!Array.isArray(list)) {
        list = [];
    }

    reportInfo.textContent =
        "จำนวนข้อมูลในรายงาน " + list.length + " รายการ";

    if (list.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="6"
                    style="padding:40px;color:#777;">
                    ยังไม่มีข้อมูลการประเมิน
                </td>
            </tr>
        `;
        return;
    }

    table.innerHTML = list.map((item,index) => {
        const score = Number(item.score) || 0;
        const level = getLevel(score);

        const classRoom = [
            String(item.className || "").trim(),
            String(item.room || "").trim()
        ].filter(Boolean).join(" / ") || "-";

        return `
            <tr>
                <td>${index + 1}</td>
                <td>${escapeHtml(item.studentId || "-")}</td>
                <td>${escapeHtml(item.name || "-")}</td>
                <td>${escapeHtml(classRoom)}</td>
                <td>${score}</td>
                <td class="${level.className}">
                    ${level.text}
                </td>
            </tr>
        `;
    }).join("");
}

async function loadReport(retry = 0){
    showLoading();

    try {
        const response = await fetch(
            API_URL + "?t=" + Date.now(),
            {
                method:"GET",
                cache:"no-store"
            }
        );

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        const result = await response.json();

        if (Array.isArray(result)) {
            data = result;
        } else if (result && Array.isArray(result.data)) {
            data = result.data;
        } else {
            throw new Error(
                result?.message ||
                "รูปแบบข้อมูลจาก API ไม่ถูกต้อง"
            );
        }

        renderReport(data);

    } catch (error) {
        console.error("โหลดรายงานไม่สำเร็จ:", error);

        if (retry < 1) {
            reportInfo.textContent = "กำลังเชื่อมต่อใหม่...";

            table.innerHTML = `
                <tr>
                    <td colspan="6"
                        style="padding:40px;color:#f9a825;">
                        ⏳ กำลังเชื่อมต่อใหม่...
                    </td>
                </tr>
            `;

            setTimeout(() => {
                loadReport(retry + 1);
            },500);

            return;
        }

        reportInfo.textContent = "โหลดข้อมูลไม่สำเร็จ";

        table.innerHTML = `
            <tr>
                <td colspan="6"
                    style="padding:40px;color:#d32f2f;">
                    ❌ โหลดข้อมูลไม่สำเร็จ
                    <br><br>
                    <button
                        class="printBtn"
                        onclick="loadReport()">
                        ลองใหม่
                    </button>
                </td>
            </tr>
        `;
    }
}

let searchTimer = null;

search.addEventListener("input", function(){
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
        const keyword =
            search.value.trim().toLowerCase();

        const result = data.filter(item => {
            const studentId =
                String(item.studentId || "").toLowerCase();

            const name =
                String(item.name || "").toLowerCase();

            const className =
                String(item.className || "").toLowerCase();

            const room =
                String(item.room || "").toLowerCase();

            const level =
                getLevel(item.score).text.toLowerCase();

            return (
                studentId.includes(keyword) ||
                name.includes(keyword) ||
                className.includes(keyword) ||
                room.includes(keyword) ||
                level.includes(keyword)
            );
        });

        renderReport(result);
    },250);
});

if (user.role === "admin") {
    document.getElementById("userRole").textContent =
        "ผู้ดูแลระบบ";
} else {
    document.getElementById("userRole").textContent =
        "ครู";
}

if (user.role !== "admin") {
    document.getElementById("settingMenu").style.display =
        "none";
}

function logout(){
    localStorage.removeItem("loginUser");
    location.href = "index.html";
}

loadReport();
</script>

</body>
</html>
